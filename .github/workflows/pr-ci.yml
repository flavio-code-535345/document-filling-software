name: PR CI + Docker Hub

on:
  pull_request:
    branches: [ main ]
  pull_request_types:
    - closed
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Run all tests
        working-directory: server
        run: |
          node scripts/selftest.js
          node scripts/ws-smoke.js
          node scripts/e2e-api.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layer
        uses: actions/cache@v4
        with:
          path: /root/.docker
          key: docker-build-${{ github.sha }}
          restore-keys: |

      - name: Build Docker image
        working-directory: server
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docflow:latest .
          docker image ls

      - name: Docker build and push
        if: github.event_name == 'workflow_dispatch'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$env:DOCKER_PASSWORD" | docker login -u "$env:DOCKER_USERNAME" --password-stdin docker.io
          docker build -t ${{ secrets.DOCKER_USERNAME }}/docflow:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/docflow:latest