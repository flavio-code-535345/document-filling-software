name: PR CI + Docker Hub

on:
  pull_request:
    branches: [ main ]
  pull_request_types:
    - closed
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Run server selftest
        working-directory: server
        run: node scripts/selftest.js

      - name: Run WS smoke test
        working-directory: server
        run: node scripts/ws-smoke.js

      - name: Run E2E API test
        working-directory: server
        run: node scripts/e2e-api.js

      - name: Docker build and push
        if: >
          github.event_name == 'workflow_dispatch' ||
          (github.event.action == 'closed' && github.event.pull_request.merged == true)
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$env:DOCKER_PASSWORD" | docker login -u "$env:DOCKER_USERNAME" --password-stdin docker.io
          docker build -t "$env:DOCKER_USERNAME/docflow:pr-${{ github.run_number }}" ./server
          docker push "$env:DOCKER_USERNAME/docflow:pr-${{ github.run_number }}"