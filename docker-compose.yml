services:
  docflow:
    image: flavio11113/docflow:latest
    pull_policy: always
    container_name: docflow
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/data
      - PUBLIC_WEB_URL=http://192.168.178.45:4000
      - SIGN_SESSION_TTL_MINUTES=10
      - MAX_UPLOAD_MB=25
      - OPENAI_API_KEY=
      - OPENAI_MODEL=gpt-4o-mini
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=
      - DISPATCH_WEBHOOK_URL=
    volumes:
      - docflow_data:/data


volumes:
  docflow_data:
    driver: local
