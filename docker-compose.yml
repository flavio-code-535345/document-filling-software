services:
  docflow:
    image: flavio11113/docflow:latest
    pull_policy: always
    container_name: docflow
    restart: unless-stopped
    ports:
      - "4458:3000"
    environment:
      # Min. 32 Zeichen! Generiere z. B. mit: openssl rand -hex 32
      - AUTH_SECRET=${AUTH_SECRET}
      - DATA_DIR=/app/data
      # Hinter HTTPS (Reverse-Proxy) auf "true" setzen.
      - COOKIE_SECURE=false
      # Optional: Gemini-Key für die KI-Felderkennung (alternativ: Einstellungen → KI)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Lokale (Ollama) Felderkennung — zeigt auf den Sidecar unten.
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - docflow_data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      # Modell nach 5 Min. Inaktivität entladen, um RAM freizugeben.
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ollama_models:/root/.ollama


volumes:
  docflow_data:
    driver: local
  ollama_models:
    driver: local
